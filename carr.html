<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Shopily</title>
  <link rel="icon" href="assets/Shopily-1.png" type="image/png">
  <link href="./dist/output.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-[#FDFFE4] font-poppins text-[#0D2540] min-h-screen flex flex-col">

  <!-- Navbar -->
  <div class="bg-gradient-to-t from-[#13324A] to-[#0D2540] px-8 py-6">
    <div class="flex items-center justify-between">
      <img src="assets/Shopily-upper.png" alt="Shopily Logo" class="h-10">
      <div class="w-1/2 relative">
        <input id="searchInput" type="text" placeholder="What would you like?" class="w-full px-5 py-2 rounded-full bg-yellow-50 text-sm text-gray-600 placeholder-gray-400 focus:outline-none"/>
        <div id="searchPreview" class="absolute top-full mt-1 w-full bg-white shadow-lg rounded-lg z-50 hidden max-h-80 overflow-y-auto border border-gray-200 opacity-0 scale-95 transition-all duration-200 ease-out"></div>
        <button class="absolute right-3 top-2 text-gray-400 hover:text-gray-700">
          <img src="assets/magnifying-glass.png" alt="Magnifier" class="h-5 w-5 opacity-40"/>
        </button>
      </div>
      <div class="text-white text-sm space-x-4">
        <a href="main.html" class="hover:underline"><i class="fa-solid fa-home fa-lg"></i></a>
        <a href="#" class="hover:underline"><i class="fa-solid fa-cart-shopping fa-lg"></i></a>
        <a href="#" class="hover:underline"><i class="fa-solid fa-gear fa-lg"></i></a>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bg-gradient-to-t from-[#13324A] to-[#0D2540] py-5">
    <div class="max-w-7xl mx-auto flex justify-center">
      <div class="space-x-10 text-white text-sm font-medium flex items-center">
        <a href="#">Shopily 12.12</a>
        <a href="#">Flash Sale</a>
        <a href="#">Featured</a>
        <a href="#">OOTD</a>
      </div>
    </div>
  </div>

  <!-- Main Cart Section -->
  <main class="flex-grow w-full max-w-5xl mx-auto px-6 py-10 flex flex-col justify-between">
    <div>
      <h1 class="text-2xl font-bold mb-6">Your Cart</h1>
      <div id="cartList" class="space-y-6"></div>

      <!-- Empty State -->
      <div id="emptyMessage" class="hidden mt-20 text-center text-gray-500 min-h-[300px] flex items-center justify-center">
        <p class="text-base font-medium">Cart is empty.</p>
      </div>
    </div>

    <!-- Total & Checkout -->
    <div id="cartSummary" class="w-full mt-8">
      <p class="text-lg font-semibold mb-2 text-right">Total: <span id="totalPrice" class="text-[#E63946]">Rp 0</span></p>
      <div class="flex justify-end gap-4">
        <button id="goCheckout" class="bg-[#E63946] hover:bg-[#d62828] text-white px-6 py-3 rounded-full font-semibold">Checkout</button>
        <button onclick="clearCart()" class="bg-gray-300 hover:bg-gray-400 text-[#0D2540] px-6 py-3 rounded-full font-semibold">Clear Cart</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gradient-to-t from-[#13324A] to-[#0D2540] px-8 py-10">
    <div class="flex items-center justify-between">
      <img src="assets/Shopily-upper.png" alt="Shopily Logo" class="h-10 w-auto"/>
      <p class="text-white text-sm font-medium">&copy; 2025 Shopily. All rights reserved.</p>
    </div>
  </footer>

  <script src="./product.js"></script>
</body>
</html>

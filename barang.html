<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Detail - Shopily</title>
  <link rel="icon" href="assets/Shopily-1.png" type="image/png">
  <link href="./dist/output.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" 
  integrity="sha512-rXn6WkHoL3B3DjA4P0St3kQk6jLVX1mtlfVY9+AxEnqdhVqU5lw9PMRBbE9ZpJ51K2UqA0sWZ9NfABHLXr+1oA==" 
  crossorigin="anonymous" 
  referrerpolicy="no-referrer"/>

</head>
<body class="bg-[#FDFFE4] font-poppins text-[#0D2540]">

  <!-- Navbar -->
  <div class="flex items-center justify-between bg-gradient-to-t from-[#13324A] to-[#0D2540] px-8 py-6">
    <img src="assets/Shopily-upper.png" alt="Shopily Logo" class="h-10">

  <div class="w-1/2 relative">
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="What would you like?" 
        class="w-full px-5 py-2 rounded-full bg-yellow-50 text-sm text-gray-600 placeholder-gray-400 focus:outline-none"
      />
      <div id="searchPreview" class="absolute top-full mt-1 w-full bg-white shadow-lg rounded-lg z-50 hidden max-h-80 overflow-y-auto border border-gray-200"></div>
    </div>
  </div>


    <div class="text-white text-sm space-x-4">
      <a href="main.html" class="hover:underline">
        <i class="fa-solid fa-home fa-lg"></i>
      </a>
      <a href="./carr.html" class="hover:underline">
        <i class="fa-solid fa-cart-shopping fa-lg"></i>
      </a>
      <a href="#" class="hover:underline">
        <i class="fa-solid fa-gear fa-lg"></i>
      </a>
    </div>
  </div>
  <!-- Botton Nav -->
    <div class="bg-gradient-to-t from-[#13324A] to-[#0D2540] py-5">
    <div class="max-w-7xl mx-auto flex justify-center">
      <div class="space-x-10 text-white text-sm font-medium flex items-center">
        <a href="#">Shopily 12.12</a>
        <a href="#">Flash Sale</a>
        <a href="#">Featured</a>
        <a href="#">OOTD</a>
      </div>
    </div>
  </div>

  <!-- Product Detail -->
  <div id="productDetails" class="max-w-6xl mx-auto mt-10 px-6 py-3 mb-28 lg:flex lg:space-x-12">
    
    <!-- Product Image -->
    <div class="flex-1">
      <div class="w-full h-full bg-gray-300 animate-pulse rounded-t-xl"></div>
      <div class="mt-4 flex gap-2">
          <div class="w-7 h-7 bg-gray-300 animate-pulse"></div>
          <div class="w-7 h-7 bg-gray-300 animate-pulse"></div>
          <div class="w-7 h-7 bg-gray-300 animate-pulse"></div>
      </div>
    </div>

    <!-- Product Info -->
    <div class="flex-1 py-5 mt-8 lg:mt-0">
      <div class="h-4 bg-gray-300 rounded w-3/4 animate-pulse mb-2"></div>
      <div class="h-4 bg-gray-300 rounded w-2/3 animate-pulse mb-2"></div>
      <div class="h-4 bg-gray-300 rounded w-2/3 animate-pulse mb-2"></div>


      <div class="mt-6 flex gap-4">
        <button class="bg-[#E63946] text-white px-6 py-2 rounded-full hover:bg-[#d62828] transition">Add to Cart</button>
        <button class="border border-[#E63946] text-[#E63946] px-6 py-2 rounded-full hover:bg-[#ffe2e2] transition">Buy Now</button>
      </div>
    </div>
  </div>

  <!-- Product Review -->

  <div class="max-w-6xl mx-auto mt-15 mb-16 px-6">
    <h2 class="text-xl font-semibold mb-4">Customer Reviews</h2>
    <div class="max-w-6xl mx-auto mt-10 px-6" id="reviewContainer">
  <!-- Reviews will appear here -->
    </div>
  </div>

  <!-- Seller Details -->
<div class="max-w-6xl mx-auto mt-8 mb-12 px-6">
  <h2 class="text-xl font-semibold mb-4">Seller Info</h2>
  <div class="bg-white p-4 rounded-xl shadow flex items-center gap-4">
    <img src="#" alt="Seller Profile" class="w-16 h-16 rounded-full object-cover">
    <div>
      <h3 class="text-lg font-bold">Azril BIGSHOP</h3>
      <p class="text-sm text-gray-600">⭐ 4.9 | 1000+ Reviews</p>
    </div>
  </div>
</div>


  <!-- Footer -->
  <div class="flex items-center justify-between bg-gradient-to-t from-[#13324A] to-[#0D2540] px-8 py-10">
    <div class="flex items-center space-x-3">
      <img src="assets/Shopily-upper.png" alt="Shopily Logo" class="h-10 w-auto"/>
    </div>
  </div>
  <div class="bg-gradient-to-t from-[#13324A] to-[#0D2540] py-4">
    <div class="max-w-7xl mx-auto text-center text-white text-sm font-medium">
      &copy; 2023 Shopily. All rights reserved.
    </div>
  </div>

<script src="product.js"></script>
</body>
</html>
